<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>W FILE MANAGER</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <div id="busy"></div>
  <header id="hdr">
    <button class="ib" id="bMenu" aria-label="Menú"></button>
    <div class="logo"><span>W</span></div>
    <h1 id="title">W FILE MANAGER</h1>
    <span class="sp"></span>
    <button class="ib" id="bSearch" aria-label="Buscar"></button>
    <button class="ib" id="bView" aria-label="Vista"></button>
    <button class="ib" id="bMore" aria-label="Más opciones"></button>
  </header>
  <main id="view"></main>
  <div id="clipbar" hidden></div>
  <div id="selbar" hidden></div>
  <nav id="nav"></nav>
  <div id="scrim" hidden></div>
  <aside id="drawer"></aside>
  <div id="layer"></div>
  <div id="viewer" hidden></div>
  <div id="gate" hidden></div>
  <div id="progress" class="progress-overlay" hidden><div class="progress-card"><div class="progress-spinner"></div><h3 id="progress-title">Procesando archivos…</h3><p id="progress-detail">Espera mientras termina la operación.</p><div class="progress-track"><i></i></div><span>NO CIERRES LA APLICACIÓN</span></div></div>
  <div id="toast"></div>
</div>
<script src="app.js"></script>
</body>
</html>
