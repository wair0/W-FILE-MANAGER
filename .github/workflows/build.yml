name: Build W FILE MANAGER

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK and source package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 34 platform and build tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/$(ls "$ANDROID_HOME/cmdline-tools" | sort -V | tail -n 1)/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Validate JavaScript syntax
        run: node --check app/src/main/assets/www/app.js

      - name: Build debug and release APKs
        run: gradle --no-daemon assembleDebug assembleRelease

      - name: Prepare deliverables
        run: |
          cp app/build/outputs/apk/release/app-release.apk WFILEMANAGER.APK
          zip -r WFILEMANAGER.zip . \
            -x '.git/*' \
            -x '*/build/*' \
            -x '.gradle/*' \
            -x 'WFILEMANAGER.APK' \
            -x 'WFILEMANAGER.zip'

      - name: Upload deliverables
        uses: actions/upload-artifact@v4
        with:
          name: WFILEMANAGER
          path: |
            WFILEMANAGER.APK
            WFILEMANAGER.zip
          if-no-files-found: error
          retention-days: 14
